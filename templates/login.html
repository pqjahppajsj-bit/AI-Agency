<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agency - Admin Login</title>
<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f4f7f6;
    font-family:Arial,sans-serif;
}
.box{
    width:min(90%,380px);
    background:white;
    padding:32px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}
h1{
    text-align:center;
    color:#006b4f;
    margin-bottom:8px;
}
.sub{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}
label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}
input{
    width:100%;
    padding:14px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}
button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#006b4f;
    color:white;
    font-size:17px;
    font-weight:bold;
}
#msg{
    text-align:center;
    margin-top:15px;
    color:#c62828;
}
</style>

<script>
(function () {
    const originalFetch = window.fetch;

    function getCsrfToken() {
        const prefix = "ai_agency_csrf=";
        const item = document.cookie
            .split("; ")
            .find(row => row.startsWith(prefix));

        return item ? decodeURIComponent(item.substring(prefix.length)) : "";
    }

    window.fetch = function (input, init) {
        init = init || {};
        const method = (init.method || "GET").toUpperCase();

        if (["POST", "PUT", "PATCH", "DELETE"].includes(method)) {
            init.headers = new Headers(init.headers || {});
            const token = getCsrfToken();

            if (token) {
                init.headers.set("X-CSRF-Token", token);
            }
        }

        return originalFetch(input, init);
    };
})();
</script>

</head>

<body>

<div class="box">
    <h1>AI Agency</h1>
    <div class="sub">Admin Dashboard</div>

    <form id="loginForm" autocomplete="off">

        <label>Admin Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label style="margin-top:18px;">Password</label>
        <input
            id="password"
            name="agency_secure_pass_2026"
            type="password"
            autocomplete="off"
            readonly
            required
        >

        <button type="submit">Login</button>

        <div id="msg"></div>
    </form>
</div>

<script>
const passwordBox = document.getElementById("password");
      setTimeout(function(){ passwordBox.value = ""; }, 500);

passwordBox.addEventListener("focus", function(){
    passwordBox.removeAttribute("readonly");
});

document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    msg.textContent = "Logging in...";

    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {
            window.location.href = "/";
        } else {
            msg.textContent = data.error || "Invalid password.";
        }

    } catch(error) {
        msg.textContent = "Connection error.";
    }
});
</script>

</body>
</html>
